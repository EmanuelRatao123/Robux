<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Grátis - Gerador Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 ROBUX GRÁTIS 🎮</h1>
            <p>Gerador de Robux 100% Funcional</p>
        </header>

        <div class="main-content">
            <div class="robux-display">
                <h2>Seus Robux: <span id="robux-count">0</span></h2>
            </div>

            <div class="generator-section">
                <h3>Selecione a quantidade:</h3>
                <div class="amount-buttons">
                    <button class="amount-btn" data-amount="1000">1.000 Robux</button>
                    <button class="amount-btn" data-amount="5000">5.000 Robux</button>
                    <button class="amount-btn" data-amount="10000">10.000 Robux</button>
                    <button class="amount-btn" data-amount="50000">50.000 Robux</button>
                </div>

                <button id="generate-btn" class="generate-button">
                    🚀 GERAR ROBUX GRÁTIS 🚀
                </button>
            </div>

            <div id="hack-terminal" class="hack-terminal hidden">
                <div class="terminal-header">
                    <span>🔒 Sistema de Hack Ativo</span>
                </div>
                <div id="terminal-content" class="terminal-content"></div>
            </div>

            <div id="success-message" class="success-message hidden">
                <h2>✅ SUCESSO!</h2>
                <p>Robux adicionados à sua conta!</p>
                <button id="claim-btn" class="claim-button">RESGATAR AGORA</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
